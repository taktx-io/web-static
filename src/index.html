<head>

  <title>TaktX Flow — High-Performance BPMN Orchestration, Open Source</title>
  <base href="/flow/">
  <!-- GitHub Pages SPA fallback: 404.html sends deep links here as /flow/?p=<path>; restore it before Angular boots. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search), p = q.get('p');
      if (p) { q.delete('p'); var s = q.toString(); history.replaceState(null, '', p + (s ? (p.indexOf('?') < 0 ? '?' : '&') + s : '') + location.hash); }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Primary meta -->
  <meta name="description" content="Production-grade, open source BPMN 2.0 engine. Horizontally scalable and Kafka-native. Works with Apache Kafka, Confluent, Redpanda, AWS MSK and Axual.">
