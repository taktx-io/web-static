<div class="cookie-banner" *ngIf="showBanner">
  <div class="cookie-banner-content">
    <p>
      This website uses cookies to ensure you get the best experience. By continuing to use this site, you consent to our use of cookies. 
      Learn more in our <a routerLink="/cookies" class="cookie-link">Cookie Policy</a>.
    </p>
    <div class="cookie-buttons">
      <button class="btn-accept-all" (click)="acceptAll()">Accept All</button>
      <button class="btn-essential" (click)="acceptEssential()">Essential Only</button>
    </div>
  </div>
</div>
